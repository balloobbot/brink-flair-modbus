name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run against a branch on demand: the dependencies are resolved fresh each
  # run (uv.lock is not committed), so a green result can go red — or back to
  # green — without anything here changing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --extra tmodbus
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result, so one failure does not mask the others.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra tmodbus
      - name: Verify the interpreter is the one this job is for
        # Without the assert, a version uv declines to select leaves the job
        # testing whatever it picked instead, and the matrix silently covers
        # one version three times.
        run: >
          uv run python -c "import sys;
          v='.'.join(map(str, sys.version_info[:2]));
          assert v == '${{ matrix.python-version }}', v"
      - name: Run tests
        run: uv run pytest
